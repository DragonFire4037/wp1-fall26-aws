name: Deploy

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  id-token: write
  contents: read
  
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Debug OIDC Token Claims
        run: |
          # Request an OIDC token from GitHub's internal token service
          RESPONSE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RESPONSE" | jq -r '.value')
          # Extract and decode the middle part (the payload/claims)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # base64url -> base64, then re-pad to a multiple of 4 so base64 -d won't truncate
          PAYLOAD=$(echo "$PAYLOAD" | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          DECODED=$(echo "$PAYLOAD" | base64 -d 2>/dev/null)
          echo "=== OIDC CLAIMS FROM GITHUB ==="
          echo "$DECODED" | jq '{aud, iss, sub, repository, repository_owner, ref}'
