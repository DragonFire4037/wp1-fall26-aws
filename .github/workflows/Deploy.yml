# Build, test, and deploy to Elastic Beanstalk
# build-test runs on pull requests targeting main and pushes to main.
# deploy runs only on a push to main after build-test succeeds.

name: Build, Test, and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EB_APPLICATION: wp1-fall26-aws
  EB_ENVIRONMENT: wp1-fall26-aws-dev
  API_PROJECT: src/Wp1Fall26Aws.Api/Wp1Fall26Aws.Api.csproj
  API_DLL: Wp1Fall26Aws.Api.dll

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Wp1Fall26Aws.slnx

      - name: Build
        run: dotnet build Wp1Fall26Aws.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Wp1Fall26Aws.slnx --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish "${{ env.API_PROJECT }}" --configuration Release --no-build --output publish

      # Pass the tested publish output to deploy so it deploys the same build.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: publish
          retention-days: 3

  deploy:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-main
      cancel-in-progress: false

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: app-publish
          path: publish

      - name: Write Procfile
        run: |
          echo "web: dotnet ${{ env.API_DLL }}" > publish/Procfile
          cat publish/Procfile

      - name: Copy .ebextensions
        run: cp -r .ebextensions publish/

      - name: Package source bundle
        run: |
          VERSION="${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"
          echo "VERSION_LABEL=$VERSION" >> "$GITHUB_ENV"
          echo "BUNDLE=wp1-$VERSION.zip" >> "$GITHUB_ENV"
          cd publish && zip -qr "../wp1-$VERSION.zip" . && cd ..

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          role-session-name: wp1-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Upload source bundle
        run: |
          EB_BUCKET="$(aws elasticbeanstalk create-storage-location --query S3Bucket --output text)"
          echo "EB_BUCKET=$EB_BUCKET" >> "$GITHUB_ENV"
          aws s3 cp "$BUNDLE" "s3://$EB_BUCKET/$EB_APPLICATION/$BUNDLE"

      - name: Create application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION_LABEL" \
            --source-bundle "S3Bucket=$EB_BUCKET,S3Key=$EB_APPLICATION/$BUNDLE" \
            --description "${GITHUB_SHA::7} by ${GITHUB_ACTOR}"

      - name: Deploy to environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$VERSION_LABEL"

      - name: Wait for environment health
        run: |
          echo "Waiting for $EB_ENVIRONMENT to finish updating..."
          MAX_WAIT_SECONDS=900
          START_TIME=$SECONDS
          while [ $((SECONDS - START_TIME)) -lt "$MAX_WAIT_SECONDS" ]; do
            read -r STATUS HEALTH <<< "$(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENVIRONMENT" \
              --query 'Environments[0].[Status,Health]' --output text)"
            echo "status=$STATUS health=$HEALTH elapsed=$((SECONDS - START_TIME))s"

            if [ "$STATUS" = "Ready" ]; then
              if [ "$HEALTH" = "Green" ]; then
                echo "Deployment succeeded."
                exit 0
              fi

              echo "Environment is Ready but health is $HEALTH."
              echo "Recent events:"
              aws elasticbeanstalk describe-events \
                --environment-name "$EB_ENVIRONMENT" --max-items 15 \
                --query 'Events[].[Severity,Message]' --output text
              exit 1
            fi

            sleep 15
          done

          echo "Timed out after ${MAX_WAIT_SECONDS}s waiting for the environment to become Ready/Green."
          echo "Recent events:"
          aws elasticbeanstalk describe-events \
            --environment-name "$EB_ENVIRONMENT" --max-items 20 \
            --query 'Events[].[EventDate,Severity,Message]' --output table
          exit 1
